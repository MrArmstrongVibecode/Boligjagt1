name: bolig-bot

on:
  schedule:
    # Reserve. Den egentlige timing styres af cron-job.org, som starter
    # workflowet via workflow_dispatch (se README). GitHub dropper ofte
    # planlagte kørsler, så de kan ikke stå alene.
    # Hver 15. minut (:07, :22, :37, :52). Undgår hele og halve timer, hvor GitHub
    # har mest travlt. Gratis i offentlige repoer; i et privat repo bruger det
    # ca. 2.980 af de 2.000 gratis minutter/md - sæt så "7,37 * * * *".
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed: gem alle nuværende boliger som set uden at sende besked"
        type: boolean
        default: false
      test_notify:
        description: "Test: send én testbesked til hver kanal (henter intet, gemmer intet)"
        type: boolean
        default: false
      dry_run:
        description: "Dry-run: send intet og gem intet (se resultatet i loggen)"
        type: boolean
        default: false

permissions:
  contents: write              # så state-filerne kan committes tilbage

concurrency:
  group: bolig-bot
  cancel-in-progress: false    # lad en igangværende kørsel blive færdig

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kør bolig-bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_GRUPPE: ${{ secrets.NTFY_TOPIC_GRUPPE }}   # valgfri: gruppens kanal
        run: |
          ARGS=""
          if [ "${{ inputs.test_notify }}" = "true" ]; then ARGS="$ARGS --test-notify"; fi
          if [ "${{ inputs.seed }}" = "true" ]; then ARGS="$ARGS --seed"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m bolig_bot $ARGS

      - name: Commit state
        if: ${{ inputs.dry_run != true && inputs.test_notify != true }}
        run: |
          git config user.name "bolig-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Ingen ændringer i state."
            exit 0
          fi
          git commit -m "Opdater bolig-state"
          for i in 1 2 3 4; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((i * 5))
          done
          echo "Kunne ikke pushe state" && exit 1
